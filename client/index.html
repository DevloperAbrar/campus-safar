<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#FF5500" />
    <meta name="author" content="CampusSafar Technologies Private Limited" />

    <style>
      html, body { margin: 0; background: #ffffff; }
      /* Prerendered SEO content: readable by crawlers, not shown to visitors */
      #root > main[data-prerender] {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /* Loading screen until React mounts (removed automatically when React replaces #root) */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0A1628;
        z-index: 9999;
      }
      #boot .ring {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #FF5500;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>

    <!--seo:start-->
    <title>School Management Software &amp; Website Development | CampusSafar</title>
    <meta name="description" content="CampusSafar builds school and college management software and custom websites for institutes and businesses across India. Attendance, marks, fees, report cards. Free demo." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://campussafar.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CampusSafar" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="School Management Software &amp; Website Development | CampusSafar" />
    <meta property="og:description" content="CampusSafar builds school and college management software and custom websites for institutes and businesses across India." />
    <meta property="og:url" content="https://campussafar.com" />
    <meta property="og:image" content="https://campussafar.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="School Management Software &amp; Website Development | CampusSafar" />
    <meta name="twitter:description" content="CampusSafar builds school and college management software and custom websites for institutes and businesses across India." />
    <meta name="twitter:image" content="https://campussafar.com/og-image.png" />
    <!--seo:end-->
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div class="ring"></div></div>
    <div id="root"><!--seo:root--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
